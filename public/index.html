<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alt Text Generator</title>

  <style>
    /* ---- Page layout: centers the card both horizontally and vertically ---- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      /* full browser height */
      display: flex;
      align-items: center;
      /* vertical centering */
      justify-content: center;
      /* horizontal centering */
      background: #f3f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2430;
      padding: 24px;
    }

    /* ---- The white card that holds everything ---- */
    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(31, 36, 48, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 14px;
    }

    /* ---- Drop area / file picker ---- */
    .dropzone {
      display: block;
      border: 2px dashed #c7cbe0;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      color: #4b5563;
      font-size: 14px;
      transition: border-color 0.2s, background 0.2s;
    }

    .dropzone:hover,
    .dropzone:focus-within {
      border-color: #5b5bd6;
      background: #f7f7ff;
    }

    .dropzone input {
      display: none;
    }

    /* hide the ugly default file input */

    /* ---- Image preview ---- */
    #preview {
      display: none;
      /* shown by JS once a file is picked */
      max-width: 100%;
      max-height: 260px;
      margin: 20px auto 0;
      border-radius: 12px;
    }

    /* ---- Button: color + rounded corners ---- */
    #go {
      margin-top: 20px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #5b5bd6;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    #go:hover:not(:disabled) {
      background: #4747b8;
    }

    #go:active:not(:disabled) {
      transform: scale(0.98);
    }

    #go:disabled {
      background: #a5a5e8;
      cursor: not-allowed;
    }

    #go:focus-visible,
    .dropzone:focus-within {
      outline: 3px solid #b9b9f2;
      outline-offset: 2px;
    }

    /* ---- Loader: a small spinning circle inside the button ---- */
    .loader {
      display: none;
      /* hidden until loading */
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #go.loading .loader {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---- Result box ---- */
    #resultBox {
      display: none;
      /* shown by JS when there is a result */
      margin-top: 24px;
      padding: 16px;
      background: #f7f7ff;
      border: 1px solid #dcdcf7;
      border-radius: 12px;
      text-align: left;
    }

    #resultBox.error {
      background: #fff5f5;
      border-color: #f5c2c2;
      color: #9b2c2c;
    }

    #resultText {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    #copy {
      margin-top: 12px;
      padding: 8px 14px;
      border: 1px solid #5b5bd6;
      border-radius: 8px;
      background: transparent;
      color: #5b5bd6;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    #copy:hover {
      background: #ececff;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Alt Text Generator</h1>
    <p class="subtitle">Upload an image and get a short description for screen readers.</p>

    <!-- Clicking this label opens the file picker -->
    <label class="dropzone">
      <span id="fileLabel">Click to choose an image</span>
      <input type="file" id="file" accept="image/*" />
    </label>

    <img id="preview" alt="Preview of the selected image" />

    <button id="go" type="button">
      <span class="loader" aria-hidden="true"></span>
      <span id="btnText">Generate alt text</span>
    </button>

    <!-- aria-live makes screen readers announce the result when it appears -->
    <div id="resultBox" aria-live="polite">
      <p id="resultText"></p>
      <button id="copy" type="button">Copy</button>
    </div>
  </main>

  <script>
    // ---- Grab the elements we need ----
    const fileInput = document.getElementById("file");
    const fileLabel = document.getElementById("fileLabel");
    const preview = document.getElementById("preview");
    const button = document.getElementById("go");
    const btnText = document.getElementById("btnText");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");
    const copyBtn = document.getElementById("copy");

    // ---- Shrink the image before uploading (faster on low-RAM machines) ----
    async function resizeImage(file, maxSize = 768) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
    }

    // ---- Show a message (normal or error) in the result box ----
    function showResult(text, isError = false) {
      resultText.textContent = text;
      resultBox.classList.toggle("error", isError);
      copyBtn.style.display = isError ? "none" : "inline-block";
      resultBox.style.display = "block";
    }

    // ---- Turn the loader on or off ----
    function setLoading(isLoading) {
      button.disabled = isLoading;                  // stop double clicks
      button.classList.toggle("loading", isLoading); // show or hide the spinner
      btnText.textContent = isLoading ? "Generating..." : "Generate alt text";
    }

    // ---- When a file is chosen: show a preview ----
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      fileLabel.textContent = file.name;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      resultBox.style.display = "none"; // clear any old result
    });

    // ---- When the button is clicked: send the image to the backend ----
    button.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return showResult("Please choose an image first.", true);

      setLoading(true);
      resultBox.style.display = "none";

      try {
        const resized = await resizeImage(file);
        const form = new FormData();
        form.append("image", resized, "image.jpg");

        const res = await fetch("/api/alt-text", { method: "POST", body: form });
        const data = await res.json();

        if (res.ok) showResult(data.altText);
        else showResult(data.error || "Something went wrong.", true);
      } catch {
        showResult("Could not reach the server. Is it running?", true);
      } finally {
        setLoading(false); // always turn the loader off
      }
    });

    // ---- Copy button ----
    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(resultText.textContent);
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
    });
  </script>
</body>

</html>
